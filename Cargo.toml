[package]
name = "c64"
version = "0.1.0"
authors = ["Tyler Colby"]
edition = "2021"
description = "C64 emulator for Precursor — 6502 CPU, VIC-II, CIA keyboard"
license = "Apache-2.0"

[dependencies]
xous = "0.9.69"
xous-ipc = "0.10.9"
log = "0.4.14"
log-server = { package = "xous-api-log", version = "0.1.68" }
xous-names = { package = "xous-api-names", version = "0.9.70" }
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.68" }
gam = { path = "../../xous-core/services/gam" }
pddb = { path = "../../xous-core/services/pddb" }
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
